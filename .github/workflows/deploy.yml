name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm run build
      # Blocking: internal links in the built site (offline, same as `npm run check:links`).
      # External links are checked weekly by link-check.yml and never block a deploy.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --remap "file://${{ github.workspace }}/dist/blog/(.*) file://${{ github.workspace }}/dist/$1"
            --remap "file://${{ github.workspace }}/dist/blog$ file://${{ github.workspace }}/dist/"
            --index-files index.html
            'dist/**/*.html'
          fail: true
          jobSummary: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
