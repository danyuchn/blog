name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm run build
      # Blocking: internal links in the built site (offline, same as local `npm run check:links`).
      # External links are checked weekly by link-check.yml and never block a deploy.
      - name: Install lychee
        env:
          LYCHEE_VERSION: v0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          base=https://github.com/lycheeverse/lychee/releases/download/lychee-$LYCHEE_VERSION
          f=lychee-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLO "$base/$f"
          echo "$LYCHEE_SHA256  $f" | sha256sum -c -
          tar xzf "$f" && sudo install lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
          lychee --version
      - run: npm run check:links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
